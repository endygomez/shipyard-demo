<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shipyard demo</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #4ade80;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, #1d4ed8 0%, transparent 40%),
          radial-gradient(circle at bottom right, #0e7490 0%, transparent 35%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(560px, 100%);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 2rem;
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.75rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--ok);
        margin-bottom: 1.25rem;
      }

      .status::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent);
      }

      dl {
        margin: 0;
        display: grid;
        grid-template-columns: 7rem 1fr;
        gap: 0.65rem 1rem;
        font-size: 0.95rem;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        color: var(--accent);
        word-break: break-all;
      }

      button {
        margin-top: 1.5rem;
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 0.65rem 1rem;
        background: var(--accent);
        color: #0f172a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status" id="status">Checking health…</div>
      <h1 id="message">Loading…</h1>
      <p>
        Minimal TypeScript Express app wired for Shipyard. Change the welcome
        message, push, and watch the preview rebuild.
      </p>
      <dl>
        <dt>service</dt>
        <dd id="service">—</dd>
        <dt>hostname</dt>
        <dd id="hostname">—</dd>
        <dt>started</dt>
        <dd id="startedAt">—</dd>
        <dt>env</dt>
        <dd id="env">—</dd>
      </dl>
      <button type="button" id="refresh">Refresh info</button>
    </main>
    <script>
      async function loadInfo() {
        const status = document.getElementById("status");
        try {
          const health = await fetch("/api/health").then((r) => r.json());
          status.textContent =
            health.status === "ok" ? "Healthy" : "Unhealthy";

          const info = await fetch("/api/info").then((r) => r.json());
          document.getElementById("message").textContent = info.message;
          document.getElementById("service").textContent = info.service;
          document.getElementById("hostname").textContent = info.hostname;
          document.getElementById("startedAt").textContent = info.startedAt;
          document.getElementById("env").textContent = info.env;
        } catch (err) {
          status.textContent = "Unreachable";
          document.getElementById("message").textContent =
            "Could not reach the API";
          console.error(err);
        }
      }

      document.getElementById("refresh").addEventListener("click", loadInfo);
      loadInfo();
    </script>
  </body>
</html>
